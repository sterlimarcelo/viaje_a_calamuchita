<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caravana Sagrada Familia</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --blue: #1a237e; --red: #d32f2f; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #f0f2f5; }
        header { background: var(--blue); color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 1000; }
        .page { display: none; padding: 15px; padding-bottom: 80px; min-height: 100vh; box-sizing: border-box; }
        .active { display: block; }
        #map { height: 60vh; width: 100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-red { background: var(--red); color: white; margin-top: 10px; }
        nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 1000; }
        nav button { flex: 1; background: none; color: #666; border: none; padding: 12px; font-size: 0.75em; }
        nav button.active-nav { color: var(--blue); border-top: 3px solid var(--blue); }
        #modal-registro { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .alerta-activa { background: var(--red) !important; color: white !important; padding: 20px; border-radius: 10px; position: fixed; top: 20%; left: 5%; width: 90%; z-index: 3000; text-align: center; box-shadow: 0 0 20px black; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<audio id="audioAlerta" loop>
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<div id="modal-registro">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 style="color: var(--blue)">Registro de Caravana</h2>
        <input type="text" id="reg-grupo" placeholder="CÓDIGO DE GRUPO (Ej: MISION1)">
        <input type="text" id="reg-nombre" placeholder="Nombre y Apellido">
        <input type="text" id="reg-vehiculo" placeholder="Modelo del Auto">
        <input type="text" id="reg-patente" placeholder="Patente">
        <button class="btn-blue" onclick="guardarRegistro()">REGISTRARME Y ENTRAR</button>
    </div>
</div>

<header id="main-header" style="display:none">CARAVANA: <span id="display-grupo"></span></header>

<div class="content">
    <div id="p-mapa" class="page">
        <div id="map"></div>
        <button class="btn-red" onclick="activarAlerta()">⚠️ EMERGENCIAS / AUXILIO</button>
    </div>

    <div id="p-pedidos" class="page">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScFTpRBCZRhmGVKYvYqQQimw9TVCYkBalDoU4a_C93YX1m8Fg/viewform?usp=header" width="100%" height="700" frameborder="0">Cargando...</iframe>
    </div>

    <div id="p-agenda" class="page">
        <div class="card">
            <h3>📅 Agenda</h3>
            <div id="tabla-agenda">Cargando...</div>
        </div>
    </div>
</div>

<nav id="main-nav" style="display:none">
    <button onclick="navTo('p-mapa', this)" class="active-nav">MAPA</button>
    <button onclick="navTo('p-pedidos', this)">PEDIDOS</button>
    <button onclick="navTo('p-agenda', this)">AGENDA</button>
</nav>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCg4QiqLk_qj7RbJaLApadz4Fp94K2iiwY",
        authDomain: "caravana-parroquia.firebaseapp.com",
        projectId: "caravana-parroquia",
        databaseURL: "https://caravana-parroquia-default-rtdb.firebaseio.com"
    };
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRZslbDHOcy7x9e4W1tL028j9vnTsRCAEQRQ7k9NmLsGUCDDwtj2fCUeqH4cxzgF0R/exec"; 

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let marcadores = {};
    let alertaSound = document.getElementById("audioAlerta");

    const carIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/744/744465.png',
        iconSize: [32, 32],
        iconAnchor: [16, 16]
    });

    // Mapa centrado en Santa Fe, Argentina[cite: 1]
    var map = L.map('map').setView([-31.6333, -60.7], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    if(localStorage.getItem("registrado")) {
        const user = JSON.parse(localStorage.getItem("datosUser"));
        if(user && user.grupo) {
            document.getElementById("modal-registro").style.display = "none";
            document.getElementById("main-header").style.display = "block";
            document.getElementById("main-nav").style.display = "flex";
            document.getElementById("display-grupo").innerText = user.grupo;
            navTo('p-mapa', document.querySelector('nav button'));
            iniciarRastreo();
            cargarAgenda();
        } else {
            localStorage.clear(); // Limpiar si los datos están incompletos
        }
    }

    function guardarRegistro() {
        const g = document.getElementById("reg-grupo").value.toUpperCase().trim();
        const d = {
            grupo: g,
            nombre: document.getElementById("reg-nombre").value,
            vehiculo: document.getElementById("reg-vehiculo").value,
            patente: document.getElementById("reg-patente").value.toUpperCase().trim(),
            alerta: false
        };

        if(!g || !d.nombre || !d.patente) return alert("Faltan datos.");

        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(d) });
        localStorage.setItem("registrado", "true");
        localStorage.setItem("datosUser", JSON.stringify(d));
        location.reload();
    }

    function iniciarRastreo() {
        const user = JSON.parse(localStorage.getItem("datosUser"));
        navigator.geolocation.watchPosition(pos => {
            db.ref(`grupos/${user.grupo}/miembros/${user.patente}`).update({ 
                lat: pos.coords.latitude, 
                lng: pos.coords.longitude, 
                nombre: user.nombre,
                vehiculo: user.vehiculo
            });
        }, null, { enableHighAccuracy: true });

        db.ref(`grupos/${user.grupo}/miembros`).on('value', snap => {
            const list = snap.val();
            for(let id in list) {
                const v = list[id];
                if(marcadores[id]) {
                    marcadores[id].setLatLng([v.lat, v.lng]);
                } else {
                    marcadores[id] = L.marker([v.lat, v.lng], {icon: carIcon}).addTo(map)
                        .bindPopup(`<b>${v.nombre}</b><br>${v.vehiculo}`);
                }

                if(v.alerta === true && id !== user.patente) {
                    map.setView([v.lat, v.lng], 16);
                    marcadores[id].openPopup();
                    alertaSound.play();
                    if(!document.getElementById("alerta-ui")) {
                        const div = document.createElement("div");
                        div.id = "alerta-ui";
                        div.className = "alerta-activa";
                        div.innerHTML = `<h3>⚠️ AUXILIO: ${v.nombre}</h3><button onclick="detenerAlertaLocal()">ENTENDIDO</button>`;
                        document.body.appendChild(div);
                    }
                }
            }
        });
    }

    function activarAlerta() {
        const user = JSON.parse(localStorage.getItem("datosUser"));
        db.ref(`grupos/${user.grupo}/miembros/${user.patente}`).update({ alerta: true });
        setTimeout(() => db.ref(`grupos/${user.grupo}/miembros/${user.patente}`).update({ alerta: false }), 60000);
    }

    function detenerAlertaLocal() {
        alertaSound.pause();
        const el = document.getElementById("alerta-ui");
        if(el) el.remove();
    }

    function cargarAgenda() {
        fetch(SCRIPT_URL).then(res => res.json()).then(data => {
            let h = "<table>";
            data.forEach((r, i) => {
                h += "<tr>" + r.map(c => i===0 ? `<th>${c}</th>` : `<td>${c}</td>`).join("") + "</tr>";
            });
            document.getElementById("tabla-agenda").innerHTML = h + "</table>";
        });
    }

    function navTo(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
        btn.classList.add('active-nav');
        if(id === 'p-mapa') setTimeout(()=> map.invalidateSize(), 300);
    }
</script>
</body>
</html>
