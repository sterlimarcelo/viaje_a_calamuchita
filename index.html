<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Caravana — Santa Fe ➜ Calamuchita (Firebase)</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <style>
    :root{
      --bg:#f5f7fb; --panel:#ffffff; --muted:#6b7280; --accent:#0d47a1; --danger:#d32f2f;
    }
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial;background:var(--bg);color:#0f1720}
    header{background:linear-gradient(90deg,var(--accent),#08306b);padding:12px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
    header h1{margin:0;font-size:18px}
    .layout{display:grid;grid-template-columns:360px 1fr 360px;gap:12px;padding:12px;height:calc(100vh - 56px);box-sizing:border-box}
    .panel{background:var(--panel);border-radius:10px;padding:12px;box-shadow:0 6px 20px rgba(15,23,36,0.06);overflow:auto}
    label{display:block;margin-top:8px;font-weight:600;color:#0f1720}
    input,select,button,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #e6eef6;background:transparent;box-sizing:border-box}
    input::placeholder{color:var(--muted)}
    .btn{background:var(--accent);color:white;border:none;padding:10px;border-radius:8px;cursor:pointer;font-weight:700}
    .btn-ghost{background:transparent;border:1px solid rgba(15,23,36,0.06)}
    .btn-danger{background:var(--danger);color:white}
    #map{width:100%;height:100%;min-height:420px;border-radius:10px;box-shadow:0 8px 30px rgba(2,6,23,0.04)}
    .vehicle-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;border:1px solid rgba(15,23,36,0.04);margin-bottom:8px}
    .status-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
    .s-ok{background:#16a34a} .s-delay{background:#f59e0b} .s-break{background:#ef4444} .s-panic{background:#ff5252}
    .small{font-size:12px;color:var(--muted)}
    .panic-banner{position:fixed;left:50%;transform:translateX(-50%);top:84px;z-index:9999;background:var(--danger);color:white;padding:12px 18px;border-radius:10px;display:none;font-weight:800}
    @media(max-width:1024px){.layout{grid-template-columns:1fr;grid-auto-rows:auto;height:auto}}
  </style>
</head>
<body>

<header>
  <div>
    <h1>Caravana — Santa Fe ➜ Calamuchita</h1>
    <div class="small">Conectado a Firebase — colección: <strong>vehiculos</strong></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn btn-ghost" id="exportBtn">Exportar</button>
    <button class="btn btn-ghost" id="adminToggle">Admin</button>
  </div>
</header>

<div class="panic-banner" id="panicBanner">⚠️ ALERTA DE PÁNICO</div>

<div class="layout">
  <!-- Left: registro y lista -->
  <div class="panel">
    <h3>Registrar vehículo</h3>
    <label>Nombre del conductor</label>
    <input id="nombre" placeholder="Juan Pérez">
    <label>Patente</label>
    <input id="patente" placeholder="ABC123">
    <label>Marca / Modelo</label>
    <input id="marca" placeholder="Toyota Hilux">
    <label>Teléfono</label>
    <input id="telefono" placeholder="+54 9 ...">

    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" id="btnRegister">Registrar y publicar</button>
      <button class="btn btn-ghost" id="btnAssign">Asignar a este dispositivo</button>
    </div>

    <hr style="margin:12px 0">

    <h4>Vehículos registrados <span id="count" class="small"></span></h4>
    <div id="list" style="margin-top:8px"></div>

    <div id="adminPanel" style="display:none;margin-top:10px">
      <hr>
      <label>Clave admin</label>
      <input id="adminKey" placeholder="clave admin">
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-ghost" id="loginAdmin">Entrar</button>
        <button class="btn btn-ghost" id="logoutAdmin" style="display:none">Salir</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn-ghost" id="btnLoadSample">Cargar ejemplo</button>
        <button class="btn-ghost" id="btnRemoveSamples">Eliminar ejemplos</button>
        <button class="btn-ghost" id="btnClearAll">Borrar todo</button>
      </div>
    </div>
  </div>

  <!-- Center: mapa -->
  <div class="panel" style="padding:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:700">Mapa</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" id="centerAll">Centrar</button>
        <button class="btn btn-ghost" id="toggleRoute">Ruta</button>
      </div>
    </div>
    <div id="map"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-danger" id="btnPanic">🚨 PÁNICO</button>
      <button class="btn btn-ghost" id="testAlarm">Probar alarma</button>
    </div>
  </div>

  <!-- Right: chat e historial -->
  <div class="panel">
    <h3>Chat</h3>
    <div id="chat" style="height:36vh;overflow:auto;padding:8px;background:#fbfdff;border-radius:6px;"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="chatInput" placeholder="Mensaje...">
      <button class="btn" id="sendChat">Enviar</button>
    </div>

    <hr style="margin:12px 0">

    <h4>Historial</h4>
    <select id="histSel"><option value="">Seleccionar vehículo</option></select>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-ghost" id="showHist">Mostrar historial</button>
      <button class="btn btn-ghost" id="hideHist">Ocultar historial</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
/* =========================
   CONFIG: Pegue aquí su firebaseConfig
   ========================= */
const firebaseConfig = {
  apiKey: "AIzaSyD1BXa7NyxcUnbeslMI0WTlafZbYYmZZdU",
  authDomain: "viaje-a-calamuchita.firebaseapp.com",
  projectId: "viaje-a-calamuchita",
  storageBucket: "viaje-a-calamuchita.firebasestorage.app",
  messagingSenderId: "739270013476",
  appId: "1:739270013476:web:26109553c13261a2cd1eb1"
};
/* ========================= */

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COL = 'vehiculos'; // colección recomendada

/* APP STATE */
let map, cluster;
let markers = {}; // id -> marker
let polylines = {};
let myVehicleId = null;
let myPatente = null;
let myName = null;
let chatMessages = [];
let adminMode = false;
const ADMIN_PASSWORD = 'admin123'; // cambiar si desea

/* INIT MAP - light mode (OSM) */
function initMap(){
  map = L.map('map', {preferCanvas:true}).setView([-31.63,-60.70],7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:''}).addTo(map);
  cluster = L.markerClusterGroup();
  map.addLayer(cluster);
}
initMap();

/* ICONS */
function createIconCircle(color, size=14){
  return L.divIcon({
    className: '',
    html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};box-shadow:0 2px 8px rgba(0,0,0,0.12);border:2px solid white"></div>`,
    iconSize: [size,size],
    iconAnchor: [size/2,size/2]
  });
}
const ICON_SELF = createIconCircle('#2b8de6', 18); // globito azul propio
const ICON_NORMAL = createIconCircle('#16a34a', 14); // verde
const ICON_PANIC = createIconCircle('#ef4444', 18); // rojo

/* UTIL: escape */
function escapeHtml(s){ return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

/* RENDER LIST */
function renderList(data){
  const list = document.getElementById('list');
  list.innerHTML = '';
  document.getElementById('count').textContent = `(${data.length})`;
  data.forEach(v=>{
    const div = document.createElement('div'); div.className='vehicle-item';
    const left = document.createElement('div');
    left.innerHTML = `<div style="font-weight:700">${escapeHtml(v.nombre)} <span class="small">(${escapeHtml(v.patente)})</span></div>
                      <div class="small">${escapeHtml(v.marca)} · ${escapeHtml(v.telefono)}</div>
                      <div style="margin-top:6px"><span class="status-dot ${v.estado==='panic'?'s-panic':v.estado==='ok'?'s-ok':v.estado==='delay'?'s-delay':'s-break'}"></span><strong>${v.estado.toUpperCase()}</strong></div>`;
    const actions = document.createElement('div'); actions.style.display='flex'; actions.style.flexDirection='column'; actions.style.gap='6px';
    const btnCenter = document.createElement('button'); btnCenter.className='btn-ghost'; btnCenter.textContent='Centrar'; btnCenter.onclick = ()=>{ if(v.lat && v.lng){ map.setView([v.lat,v.lng],14); } else alert('Sin posición'); };
    const btnPanic = document.createElement('button'); btnPanic.className='btn-danger'; btnPanic.textContent='Pánico'; btnPanic.onclick = ()=>panicVehicle(v.id);
    actions.appendChild(btnCenter); actions.appendChild(btnPanic);
    if(adminMode){
      const del = document.createElement('button'); del.className='btn-ghost'; del.textContent='Eliminar'; del.onclick = ()=>deleteVehicle(v.id);
      actions.appendChild(del);
    }
    div.appendChild(left); div.appendChild(actions);
    list.appendChild(div);
  });
}

/* MARKERS: manage */
function setMarker(v){
  // remove old
  if(markers[v.id]) cluster.removeLayer(markers[v.id]);
  if(!v.lat || !v.lng) return;
  const isMine = (v.id === myVehicleId);
  const icon = v.estado === 'panic' ? ICON_PANIC : (isMine ? ICON_SELF : ICON_NORMAL);
  const marker = L.marker([v.lat,v.lng], {icon});
  marker.bindPopup(`<strong>${escapeHtml(v.nombre)}</strong><br>${escapeHtml(v.patente)}<br>${escapeHtml(v.marca)}<br>Estado: <strong>${v.estado}</strong>`);
  markers[v.id] = marker;
  cluster.addLayer(marker);
}

/* POLYLINES for history */
function drawHistory(v){
  if(polylines[v.id]){ map.removeLayer(polylines[v.id]); delete polylines[v.id]; return; }
  if(!v.history || v.history.length<2) return alert('No hay historial suficiente');
  const coords = v.history.map(p=>[p.lat,p.lng]);
  polylines[v.id] = L.polyline(coords, {color:'#f97316', weight:4, opacity:0.9}).addTo(map);
  map.fitBounds(polylines[v.id].getBounds().pad(0.4));
}

/* FIRESTORE: real-time listener */
let unsubscribe = null;
function startListener(){
  if(unsubscribe) unsubscribe();
  unsubscribe = db.collection(COL).onSnapshot(snapshot=>{
    const list = [];
    snapshot.forEach(doc=>{
      const data = doc.data();
      data.id = doc.id;
      // ensure history array exists
      data.history = data.history || [];
      list.push(data);
    });
    // render list and markers
    renderList(list);
    // clear markers
    cluster.clearLayers();
    markers = {};
    list.forEach(setMarker);
    updateHistSelect(list);
  }, err=>console.error('Firestore listen error', err));
}
startListener();

/* REGISTER VEHICLE */
document.getElementById('btnRegister').addEventListener('click', async ()=>{
  const nombre = document.getElementById('nombre').value.trim();
  const patente = document.getElementById('patente').value.trim();
  const marca = document.getElementById('marca').value.trim();
  const telefono = document.getElementById('telefono').value.trim();
  if(!nombre || !patente) return alert('Nombre y patente son obligatorios');
  // create Firestore doc
  try{
    const docRef = await db.collection(COL).add({
      nombre, patente, marca, telefono, estado:'ok', lat:null, lng:null, history:[], createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    // assign this vehicle to this device
    myVehicleId = docRef.id; myPatente = patente; myName = nombre;
    localStorage.setItem('caravana_owner_id', myVehicleId);
    localStorage.setItem('caravana_owner_patente', myPatente);
    localStorage.setItem('caravana_owner_name', myName);
    alert('Vehículo creado y publicado');
    // try to capture position immediately
    updateMyPositionOnce();
  }catch(e){ console.error(e); alert('Error al crear vehículo: '+e.message); }
});

/* ASSIGN button (assign last registered vehicle) */
document.getElementById('btnAssign').addEventListener('click', ()=>{
  const id = localStorage.getItem('caravana_owner_id');
  if(id){ alert('Ya hay un vehículo asignado a este dispositivo'); return; }
  // simple: get last vehicle created by this browser? fallback: ask user to click the vehicle and assign (not implemented)
  alert('Función automática: registre un vehículo y se asignará automáticamente.');
});

/* UPDATE OWN POSITION (write to Firestore) */
async function updateMyPosition(lat,lng){
  if(!myVehicleId) return;
  try{
    const docRef = db.collection(COL).doc(myVehicleId);
    // add to history (limit to recent 200 points locally)
    await docRef.update({
      lat, lng,
      lastUpdate: firebase.firestore.FieldValue.serverTimestamp(),
      history: firebase.firestore.FieldValue.arrayUnion({lat,lng,t:Date.now()})
    });
  }catch(e){ console.error('updateMyPosition error', e); }
}

/* try to get position and update once */
async function updateMyPositionOnce(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    await updateMyPosition(lat,lng);
  }, err=>console.warn('geoloc error', err), {enableHighAccuracy:true, timeout:10000});
}

/* periodic auto update (every 6s) */
setInterval(async ()=>{
  const ownerId = localStorage.getItem('caravana_owner_id');
  if(ownerId) myVehicleId = ownerId;
  if(!myVehicleId) return;
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    await updateMyPosition(lat,lng);
  }, err=>{/* ignore on deny */}, {enableHighAccuracy:true, maximumAge:2000, timeout:8000});
}, 6000);

/* DELETE vehicle (admin) */
async function deleteVehicle(id){
  if(!confirm('Eliminar vehículo?')) return;
  try{
    await db.collection(COL).doc(id).delete();
    alert('Eliminado');
  }catch(e){ console.error(e); alert('Error al eliminar: '+e.message); }
}

/* PANIC: mark vehicle in panic state */
async function panicVehicle(id){
  try{
    await db.collection(COL).doc(id).update({ estado:'panic', panicAt: firebase.firestore.FieldValue.serverTimestamp() });
    showPanic(`${id} en PÁNICO`);
  }catch(e){ console.error(e); alert('Error pánico: '+e.message); }
}

/* GLOBAL PANIC button: create temporary panic marker from this device */
document.getElementById('btnPanic').addEventListener('click', async ()=>{
  if(!navigator.geolocation) return alert('GPS no disponible');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    // create temporary doc to show panic OR update my vehicle
    if(myVehicleId){
      await db.collection(COL).doc(myVehicleId).update({ estado:'panic', lat, lng, panicAt: firebase.firestore.FieldValue.serverTimestamp() });
    } else {
      // create a temporary panic doc
      await db.collection(COL).add({ nombre:'PÁNICO', patente:'!!', marca:'', telefono:'', estado:'panic', lat, lng, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    showPanic('Pánico enviado');
  }, err=>alert('No se pudo obtener ubicación: '+err.message), {enableHighAccuracy:true});
});

/* show panic banner + sound */
function showPanic(text){
  const b = document.getElementById('panicBanner'); b.textContent = text; b.style.display = 'block';
  playAlarm(10000);
  setTimeout(()=>{ b.style.display='none'; }, 18000);
}

/* audio alarm */
function playAlarm(duration=8000){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type='sawtooth'; o.frequency.value=440; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.1);
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, duration);
  }catch(e){ console.warn('Audio error', e); }
}

/* CHAT: simple Firestore chat (collection 'chat') */
document.getElementById('sendChat').addEventListener('click', async ()=>{
  const txt = document.getElementById('chatInput').value.trim(); if(!txt) return;
  const from = localStorage.getItem('caravana_owner_name') || (myName || 'Anon');
  await db.collection('chat').add({ from, txt, t: firebase.firestore.FieldValue.serverTimestamp() });
  document.getElementById('chatInput').value = '';
});
db.collection('chat').orderBy('t').limitToLast(200).onSnapshot(snap=>{
  const msgs = []; snap.forEach(d=> msgs.push(d.data())); const container = document.getElementById('chat'); container.innerHTML='';
  msgs.forEach(m=>{ const el = document.createElement('div'); el.style.padding='6px'; el.style.marginBottom='6px'; el.style.background='#fbfdff'; el.innerHTML = `<strong style="color:${m.from===myName?'#0d47a1':'#0d1720'}">${escapeHtml(m.from)}</strong> <span class="small" style="margin-left:8px">${m.t?new Date(m.t.toMillis()).toLocaleTimeString():''}</span><div style="margin-top:6px">${escapeHtml(m.txt)}</div>`; container.appendChild(el); });
  container.scrollTop = container.scrollHeight;
});

/* HISTORY select helper */
function updateHistSelect(list){
  const sel = document.getElementById('histSel'); sel.innerHTML = '<option value="">Seleccionar vehículo</option>';
  list.forEach(v=> sel.innerHTML += `<option value="${v.id}">${escapeHtml(v.nombre)} (${escapeHtml(v.patente)})</option>`);
}
document.getElementById('showHist').addEventListener('click', async ()=>{
  const id = document.getElementById('histSel').value; if(!id) return;
  const doc = await db.collection(COL).doc(id).get(); if(!doc.exists) return alert('No existe');
  const v = doc.data(); v.id = doc.id;
  if(!v.history || v.history.length<2) return alert('Sin historial');
  if(polylines[v.id]){ map.removeLayer(polylines[v.id]); delete polylines[v.id]; return; }
  polylines[v.id] = L.polyline(v.history.map(p=>[p.lat,p.lng]), {color:'#f97316', weight:4}).addTo(map);
  map.fitBounds(polylines[v.id].getBounds().pad(0.3));
});
document.getElementById('hideHist').addEventListener('click', ()=>{ for(const k in polylines){ map.removeLayer(polylines[k]); } polylines={}; });

/* ADMIN login */
document.getElementById('loginAdmin').addEventListener('click', ()=> {
  const key = document.getElementById('adminKey').value || '';
  if(key === ADMIN_PASSWORD){
    adminMode = true; document.getElementById('logoutAdmin').style.display='inline-block'; document.getElementById('loginAdmin').style.display='none';
    document.getElementById('adminPanel').style.display='block'; alert('Admin ok');
  } else alert('Clave incorrecta');
});
document.getElementById('logoutAdmin').addEventListener('click', ()=> {
  adminMode = false; document.getElementById('logoutAdmin').style.display='none'; document.getElementById('loginAdmin').style.display='inline-block';
  document.getElementById('adminPanel').style.display='none'; alert('Sesión admin cerrada');
});

/* admin bulk actions */
document.getElementById('btnLoadSample').addEventListener('click', async ()=>{
  const samples = [
    {nombre:'Juan Pérez',patente:'ABC123',marca:'Hilux',telefono:'+54 9 341 123',estado:'ok',lat:-31.6333,lng:-60.7,history:[]},
    {nombre:'María López',patente:'XYZ987',marca:'Cronos',telefono:'+54 9 341 555',estado:'delay',lat:-32.5,lng:-61.5,history:[]}
  ];
  for(const s of samples) await db.collection(COL).add(s);
});
document.getElementById('btnRemoveSamples').addEventListener('click', async ()=>{
  if(!adminMode) return alert('Acceso denegado');
  const snap = await db.collection(COL).where('marca','in',['Hilux','Cronos']).get();
  const batch = db.batch();
  snap.forEach(d=> batch.delete(d.ref));
  await batch.commit();
  alert('Ejemplos eliminados');
});
document.getElementById('btnClearAll').addEventListener('click', async ()=>{
  if(!adminMode) return alert('Acceso denegado');
  if(!confirm('Borrar TODOS los vehículos?')) return;
  const snap = await db.collection(COL).get();
  const batch = db.batch();
  snap.forEach(d=> batch.delete(d.ref));
  await batch.commit();
  alert('Todos eliminados');
});

/* realtime listener for vehicles to update map/list */
db.collection(COL).onSnapshot(snap=>{
  const list = [];
  snap.forEach(doc=> {
    const d = doc.data(); d.id = doc.id; d.history = d.history || [];
    list.push(d);
  });
  renderList(list);
  // update markers
  cluster.clearLayers(); markers={};
  list.forEach(v=> setMarker(v));
  updateHistSelect(list);
});

/* export simple txt */
document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const snap = await db.collection(COL).get();
  const arr = [];
  snap.forEach(d=> { const v = d.data(); arr.push(`${v.nombre} (${v.patente}) ${v.marca} ${v.telefono} ${v.estado}`); });
  const blob = new Blob([arr.join('\n')], {type:'text/plain'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='vehiculos.txt'; a.click();
});

/* center all */
document.getElementById('centerAll').addEventListener('click', ()=>{
  db.collection(COL).get().then(snap=>{
    const pts = []; snap.forEach(d=> { const v=d.data(); if(v.lat && v.lng) pts.push([v.lat,v.lng]); });
    if(pts.length===0) return alert('No hay posiciones');
    map.fitBounds(L.latLngBounds(pts).pad(0.35));
  });
});

/* storage: store owner id when created */
db.collection(COL).orderBy('createdAt', 'desc').limit(1).get().then(()=>{}).catch(()=>{});

/* listen to storage events to show panic from other tabs (optional fallback) */
window.addEventListener('storage', ev=> {
  if(ev.key === 'caravana_panic'){ try{ const info=JSON.parse(ev.newValue||'{}'); showPanic(info.text); }catch(e){} }
});

/* small helpers */
function showPanicLocal(text){ localStorage.setItem('caravana_panic', JSON.stringify({t:Date.now(), text})); showPanic(text); }

/* end of file */
</script>
</body>
</html>
